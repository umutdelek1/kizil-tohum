<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kızıl Tohum</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-title">Kızıl Tohum</div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>
        <div id="unity-fullscreen-button" title="Tam ekran"></div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      let canvas = document.querySelector("#unity-canvas");

      // Geçici uyarılar kısa süre görünür; hata kalıcıdır.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; color: black; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        fullscreenElementID: "unity-fullscreen-container",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "flex";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => {
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
